name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Project & Inject Code
        run: |
          flutter create temp_app --platforms=android --org com.gununayeti.app
          cp pubspec.yaml temp_app/pubspec.yaml
          rm -rf temp_app/lib/*
          cp lib/main.dart temp_app/lib/main.dart

      - name: Build APK
        run: |
          cd temp_app
          flutter pub get
          yes "y" | flutter doctor --android-licenses || true
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
