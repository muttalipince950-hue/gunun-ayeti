name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Otomatik Android Altyapısını Kur
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name gunun_ayeti
          fi

      - name: Paketleri Yükle
        run: flutter pub get

      - name: APK Dosyasını Derle
        run: flutter build apk --release

      - name: APK'yı Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
